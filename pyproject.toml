[project]
name = "inundated"
version = "0.1.0"
description = "Inventory, classify and re-home a decade of code projects"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "puremagic>=1.28",
]

[project.scripts]
inundated = "inundated.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inundated"]
